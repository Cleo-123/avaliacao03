<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fome de Monstro - Cadastrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">👾 Fome de Monstro</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="produtos.html">Cardápio</a>
            <a href="login.html">Login</a>
            <a href="cadastrar.html" class="active">Cadastrar</a>
        </nav>
    </header>

    <main class="form-container">
        <div class="form-card">
            <h2>Criar Registro de Fome 📝</h2>
            <form>
                <div class="input-group">
                    <label>Nome do Esganado</label>
                    <input type="text" placeholder="Como te chamamos?" required>
                </div>
                <div class="input-group">
                    <label>E-mail para Alertas de Comida</label>
                    <input type="email" placeholder="onde enviamos os cupons?" required>
                </div>
                <div class="input-group">
                    <label>Criar Senha de Acesso</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-secondary btn-block">Entrar Pro Bando 👑</button>
            </form>
            <p class="form-footer">Já tem cadastro? <a href="login.html">Faça login</a></p>
        </div>
    </main>

    <footer>
        <p>Feito com ➔ para estômagos sem fundo © 2026.</p>
    </footer>
</body>
</html>
