                    <label>Senha Secreta</label>
                    <input type="password" placeholder="••••••••" required>

                <button type="submit" class="btn btn-primary btn-block">Abrir a Geladeira 🔓</button>
            </form>
            <p class="form-footer">Ainda sem clã? <a href="cadastrar.html">Cadastre-se aqui</a></p>
        </div>
